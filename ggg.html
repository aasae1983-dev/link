<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="صفحة أحمد أشرف">
  <title>أحمد أشرف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1a2e;
      --bg-2: #030a14;
      --card: #051531;
      --card-hover: #213a66;
      --text: #eef3fb;
      --muted: #9fb2d1;
      --mint: #5eead4;
      --amber: #fbbf24;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Tajawal", Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(94, 234, 212, .13), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(251, 191, 36, .10), transparent 40%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 56px 20px;
    }

    .wrap { width: 100%; max-width: 560px; }

    header { text-align: center; margin-bottom: 40px; }

    .avatar {
      width: 92px; height: 92px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 40px; font-weight: 800;
      color: #0f1a2e;
      background: linear-gradient(135deg, var(--mint), var(--amber));
      box-shadow: 0 0 0 5px rgba(186, 235, 11, 0.18);
    }

    h1 { font-size: 2.1rem; font-weight: 800; }
    header p { color: var(--muted); margin-top: 6px; font-size: 1.05rem; }

    .links { display: grid; gap: 14px; list-style: none; }

    .link {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: var(--radius);
      color: var(--text);
      text-decoration: none;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .link:hover, .link:focus-visible {
      background: var(--card-hover);
      border-color: var(--mint);
      transform: translateY(-3px);
      outline: none;
    }

    .icon {
      flex: none;
      width: 54px; height: 54px;
      display: grid; place-items: center;
      font-size: 26px;
      border-radius: 14px;
      background: rgba(94, 234, 212, .12);
    }
    .link:nth-child(2) .icon { background: rgba(251, 191, 36, .14); }

    .text { flex: 1; }
    .text strong { display: block; font-size: 1.2rem; font-weight: 500; }
    .text span { color: var(--muted); font-size: .92rem; }

    .arrow { color: var(--mint); font-size: 1.4rem; }

    footer { text-align: center; margin-top: 40px; color: var(--muted); font-size: .9rem; }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .link:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="avatar">أ</div>
      <h1>أحمد أشرف</h1>
      <p>مشاريعي وأدواتي في مكان واحد</p>
    </header>

    <ul class="links">
      <li>
        <a class="link" href="index%20(1).html">
          <div class="icon">🍅</div>
          <div class="text">
            <strong>تقنية البرومودورو</strong>
            <span>نظّم وقتك وركّز أكتر</span>
          </div>
          <div class="arrow">‹</div>
        </a>
      </li>
      <li>
        <a class="link" href="https://aasae1983-dev.github.io/index.html/" target="_blank" rel="noopener">
          <div class="icon">🌙</div>
          <div class="text">
            <strong>جلسة الاستغفار</strong>
            <span>موقع اذكار  </span>
          </div>
          <div class="arrow">‹</div>
        </a>
      </li>
      <!-- لإضافة رابط جديد انسخ <li> كامل من فوق وغيّر الأيقونة والعنوان والرابط -->
    </ul>

    <footer>© أحمد أشرف</footer>
  </main>
</body>
</html>
